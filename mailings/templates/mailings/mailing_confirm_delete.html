{% extends 'mailings/base.html' %}

{% block title %}Удалить рассылку{% endblock %}

{% block content %}
    <h2>Подтвердите удаление рассылки</h2>
    <p>Вы уверены, что хотите удалить рассылку "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{% url 'mailing_list' %}">Отмена</a>
    </form>
{% endblock %}
