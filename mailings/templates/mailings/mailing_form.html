{% extends 'base.html' %}

{% block title %}{% if object.pk %}Редактировать рассылку{% else %}Создать рассылку{% endif %}{% endblock %}

{% block content %}
    <h2>{% if object.pk %}Редактировать рассылку{% else %}Создать новую рассылку{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
        <a href="{% url 'mailing_list' %}">Отмена</a>
    </form>
{% endblock %}
